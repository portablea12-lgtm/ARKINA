<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ARKINA Admin</title>
<link rel="manifest" href="/admin-manifest.json">
<meta name="theme-color" content="#2B3BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Admin">
<link rel="apple-touch-icon" href="/icon-admin-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#2B3BFF;--bg:#0B0D1A;--paper:#12162B;--ink:#F0F2FF;--ink2:#8890B8;--line:#1E2340;--red:#E5384F;--gold:#FFB020;--green:#12B76A;--display:'Unbounded',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
a{color:inherit;text-decoration:none}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 80px}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.5px;flex:1}
.logo span{color:var(--acc)}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:12px;font-weight:800;padding:2px 7px;min-width:22px;text-align:center}
#notifOn{font-size:13px;color:var(--green)}

/* BOUTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:12px;border:0;font:600 14px var(--body);cursor:pointer;background:var(--acc);color:#fff;transition:opacity .15s}
.btn:hover{opacity:.85}.btn.sm{padding:7px 13px;font-size:13px}
.btn.ghost{background:var(--line);color:var(--ink)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.4;pointer-events:none}

/* CONNEXION */
#loginBox{padding:48px 0;display:flex;flex-direction:column;gap:14px}
#loginBox h2{font-family:var(--display);font-size:22px;margin-bottom:4px}
label{font-size:13px;color:var(--ink2);display:block;margin-bottom:4px;margin-top:10px}
input,select,textarea{width:100%;padding:11px 14px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.err{color:var(--red);font-size:14px}

/* STATS */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--paper);border-radius:14px;padding:14px;border:1px solid var(--line)}
.kpi b{display:block;font-size:24px;font-weight:700;margin-bottom:2px}
.kpi span{font-size:13px;color:var(--ink2)}

/* SECTIONS */
.sec{margin-top:20px}
.sec h3{font-family:var(--display);font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.item{background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line)}
.item b{display:block;font-size:15px;margin-bottom:3px}
.item .note{font-size:13px;color:var(--ink2)}
.item .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
select.stat{padding:6px 10px;border-radius:8px;font-size:13px;background:var(--paper);border:1px solid var(--line);color:var(--ink)}

/* MESSAGES */
.chat{height:280px;overflow:auto;background:var(--bg);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;margin:10px 0;border:1px solid var(--line)}
.bub{max-width:85%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--acc);color:#fff;border:none;border-bottom-right-radius:4px}
.bub.dlv{border:1.5px solid var(--green);background:rgba(18,183,106,.1)}
.bub span{display:block;font-size:11px;opacity:.6;margin-top:3px}
.convlist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.convbtn{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:flex;align-items:center;gap:10px}
.convbtn.on,.convbtn:hover{border-color:var(--acc)}
.convbtn .em{font-size:20px}
.convbtn .info{flex:1;min-width:0}.convbtn .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convbtn .info span{font-size:12px;color:var(--ink2)}
.convbtn .n{background:var(--red);color:#fff;border-radius:10px;font-size:12px;font-weight:800;padding:2px 7px;flex-shrink:0}
.chatin{display:flex;gap:8px;align-items:flex-end}
.chatin textarea{flex:1;min-height:0;rows:2;resize:none}

/* ONGLETS BAS */
.tabnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:100}
.tabnav button{flex:1;background:none;border:0;color:var(--ink2);font:inherit;font-size:11px;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabnav button.on{color:var(--acc)}
.tabnav button .ico{font-size:22px}
.tabnav button .nbadge{position:absolute;top:4px;right:calc(50% - 18px);background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:0 5px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center}

/* NOTIF BANNER */
.notifbar{background:linear-gradient(135deg,#1a1f3a,#2B3BFF22);border:1.5px solid var(--acc);border-radius:14px;padding:14px;margin:16px 0;display:flex;gap:12px;align-items:center}
.notifbar .txt{flex:1;font-size:14px;line-height:1.4}
.notifbar .txt b{display:block;margin-bottom:2px}
.pulse{animation:pulse 2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<nav>
  <div class="logo">ARKINA <span>Admin</span></div>
  <span id="notifOn" style="display:none">🔔 Alertes ON</span>
</nav>

<div class="wrap" id="app">
  <!-- Chargement -->
  <div id="loadingBox" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px">
    <div style="width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite"></div>
    <p style="color:var(--ink2);font-size:15px">Connexion en cours…</p>
  </div>
  <!-- Connexion -->
  <div id="loginBox" style="display:none">
    <h2>👋 Connexion admin</h2>
    <p class="note" style="color:var(--ink2)">Connectez-vous pour gérer votre boutique et recevoir les alertes.</p>
    <div>
      <label>Email</label>
      <input id="lE" type="email" autocomplete="email" placeholder="portablea12@gmail.com">
    </div>
    <div>
      <label>Mot de passe</label>
      <input id="lP" type="password" autocomplete="current-password">
    </div>
    <p class="err" id="lErr"></p>
    <button class="btn" onclick="doLogin()">Se connecter</button>
  </div>
</div>

<!-- Onglets (cachés jusqu'à connexion) -->
<nav class="tabnav" id="tabnav" style="display:none">
  <button class="on" onclick="showTab('dash')" id="tb-dash">
    <span class="ico">📊</span><span>Dashboard</span>
  </button>
  <button onclick="showTab('orders')" id="tb-orders">
    <span class="ico">🛒</span><span>Commandes</span>
    <span class="nbadge" id="nb-orders" style="display:none"></span>
  </button>
  <button onclick="showTab('msgs')" id="tb-msgs">
    <span class="ico">💬</span><span>Messages</span>
    <span class="nbadge" id="nb-msgs" style="display:none"></span>
  </button>
  <button onclick="showTab('reviews')" id="tb-reviews">
    <span class="ico">⭐</span><span>Avis</span>
    <span class="nbadge" id="nb-reviews" style="display:none"></span>
  </button>
</nav>

<script>
const SB_URL = "https://nsskercmbmgmdftcpatd.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zc2tlcmNtYm1nbWRmdGNwYXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTE4NDMsImV4cCI6MjEwNjUyNzg0M30.Y2imKy5q0JFAJsM70doTtvys5KQR3T26CLgoiLnl5VA";
const sb = supabase.createClient(SB_URL, SB_KEY);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = v => Number(v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const $ = id => document.getElementById(id);
let U = null, ADM = false, swReg = null, _curTab = 'dash';
let O = [], R = [], MSG = [], _ac = null;

/* ── Service Worker ── */
async function initSW(){
  if(!('serviceWorker' in navigator)) return;
  try {
    // Désinstalle TOUS les anciens SW (y compris admin-sw avec mauvais scope)
    const regs = await navigator.serviceWorker.getRegistrations();
    for(const r of regs) await r.unregister();
    // Ré-enregistre uniquement le SW admin, sans scope (= scope par défaut du fichier)
    swReg = await navigator.serviceWorker.register('/admin-sw.js');
    navigator.serviceWorker.addEventListener('message', e => {
      if(e.data?.type === 'REFRESH') refreshData();
    });
    // Force la mise à jour si une nouvelle version est disponible
    swReg.addEventListener('updatefound', () => {
      const newSW = swReg.installing;
      newSW.addEventListener('statechange', () => {
        if(newSW.state === 'installed' && navigator.serviceWorker.controller){
          newSW.postMessage({type: 'SKIP_WAITING'});
        }
      });
    });
  } catch(err) { console.warn('SW:', err); }
}

async function sendTokenToSW(token){
  if(!swReg) return;
  const w = swReg.active || swReg.installing || swReg.waiting;
  if(w) w.postMessage({type: 'SET_TOKEN', token});
}

/* ── Notifications ── */
async function initNotif(){
  if(!('Notification' in window) || !ADM) return;
  if(Notification.permission === 'default'){
    await Notification.requestPermission();
  }
  const on = Notification.permission === 'granted';
  $('notifOn').style.display = on ? '' : 'none';
  /* Periodic Background Sync si supporté */
  if(on && swReg && 'periodicSync' in swReg){
    try {
      await swReg.periodicSync.register('arkina-poll', {minInterval: 60 * 1000});
    } catch(e) {}
  }
  /* Fallback : polling depuis la page toutes les 30s */
  setInterval(refreshData, 30000);
}

/* ── Auth ── */
async function doLogin(){
  const email = $('lE').value.trim(), pw = $('lP').value;
  if(!email||!pw){ $('lErr').textContent='Email et mot de passe requis.'; return; }
  $('lErr').textContent=''; document.querySelector('#loginBox .btn').disabled = true;
  const {data, error} = await sb.auth.signInWithPassword({email, password:pw});
  document.querySelector('#loginBox .btn').disabled = false;
  if(error){ $('lErr').textContent = error.message; return; }
  const r = await sb.rpc('is_admin');
  if(r.data !== true){ await sb.auth.signOut(); $('lErr').textContent = 'Ce compte n\'est pas administrateur.'; return; }
  U = data.user;
  const sess = await sb.auth.getSession();
  await sendTokenToSW(sess.data.session?.access_token);
  ADM = true;
  showAdmin();
}
async function doLogout(){
  await sb.auth.signOut();
  swReg?.active?.postMessage({type:'RESET'});
  U = null; ADM = false;
  $('tabnav').style.display = 'none';
  $('app').innerHTML = `<div id="loginBox"><h2>👋 Connexion admin</h2><div><label>Email</label><input id="lE" type="email" placeholder="portablea12@gmail.com"></div><div><label>Mot de passe</label><input id="lP" type="password"></div><p class="err" id="lErr"></p><button class="btn" onclick="doLogin()">Se connecter</button></div>`;
}

/* ── Affichage principal ── */
function showAdmin(){
  $('loginBox') && ($('loginBox').style.display = 'none');
  $('loadingBox') && ($('loadingBox').style.display = 'none');
  $('app').innerHTML = '<div id="dash"></div><div id="orders" style="display:none"></div><div id="msgs" style="display:none"></div><div id="reviews" style="display:none"></div>';
  $('tabnav').style.display = 'flex';
  initNotif();
  refreshData();
}

function showTab(t){
  _curTab = t;
  ['dash','orders','msgs','reviews'].forEach(k => { $(k).style.display = k===t?'':'none'; document.getElementById('tb-'+k).classList.toggle('on', k===t); });
  renderTab(t);
}

/* ── Données ── */
async function refreshData(){
  if(!ADM) return;
  const [a,b,c] = await Promise.all([
    sb.from('orders').select('*').order('created_at',{ascending:false}),
    sb.from('reviews').select('*').order('created_at',{ascending:false}),
    sb.from('messages').select('*').order('created_at',{ascending:false})
  ]);
  O = a.data||[]; R = b.data||[]; MSG = (c.data||[]).reverse();
  updateBadges();
  renderTab(_curTab);
}

function updateBadges(){
  const nO = O.filter(o=>o.status==='en attente').length;
  const nR = R.filter(r=>!r.approved).length;
  const nM = MSG.filter(m=>!m.from_admin&&!m.read).length;
  badge('orders', nO); badge('reviews', nR); badge('msgs', nM);
}
function badge(id, n){ const b=$('nb-'+id); if(!b) return; b.textContent=n; b.style.display=n?'':'none'; }

/* ── Dashboard ── */
function renderDash(){
  const paid = O.filter(o=>['payée','livrée'].includes(o.status));
  const ca = paid.reduce((a,o)=>a+Number(o.price),0);
  const nO = O.filter(o=>o.status==='en attente').length;
  const nR = R.filter(r=>!r.approved).length;
  const nM = MSG.filter(m=>!m.from_admin&&!m.read).length;
  const notifOk = Notification.permission === 'granted';
  $('dash').innerHTML = `
    ${!notifOk ? `<div class="notifbar"><div class="txt"><b>🔔 Activez les alertes</b>Pour recevoir les notifications de commandes, messages et avis.</div><button class="btn sm" onclick="initNotif()">Activer</button></div>` : ''}
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><b style="color:${nO?'var(--red)':'var(--green)'}">${nO}</b><span>Commandes en attente</span></div>
      <div class="kpi"><b>${paid.length}</b><span>Commandes payées</span></div>
      <div class="kpi"><b>${eur(ca)}</b><span>CA encaissé</span></div>
      <div class="kpi"><b style="color:${nM?'var(--red)':'var(--green)'}">${nM}</b><span>Messages non lus</span></div>
      <div class="kpi"><b style="color:${nR?'var(--gold)':'var(--green)'}">${nR}</b><span>Avis à valider</span></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      <a href="https://arkina.fr/#admin" target="_blank" class="btn ghost sm">🌐 Ouvrir la boutique</a>
      <button class="btn red sm" onclick="doLogout()">Déconnexion</button>
    </div>`;
}

/* ── Commandes ── */
function renderOrders(){
  const filt = $('oFilter')?.value || '';
  const list = filt ? O.filter(o=>o.status===filt) : O;
  $('orders').innerHTML = `<div class="sec">
    <h3>🛒 Commandes</h3>
    <select class="stat" id="oFilter" onchange="renderOrders()" style="margin-bottom:10px">
      <option value="">Toutes</option>
      <option value="en attente">En attente</option>
      <option value="payée">Payée</option>
      <option value="livrée">Livrée</option>
      <option value="annulée">Annulée</option>
    </select>
    ${list.length ? list.map(o => `<div class="item">
      <b>#${esc(String(o.id).slice(0,8).toUpperCase())} · ${esc(o.items?.map(i=>i.qty+'× '+i.name).join(', ')||o.product_name)}</b>
      <div class="note">${esc(o.user_email)} · ${new Date(o.created_at).toLocaleDateString('fr-FR')} · ${eur(o.price)}</div>
      <div class="row">
        <select class="stat" onchange="setStatus('${o.id}',this.value)">
          ${['en attente','payée','livrée','annulée'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn sm" onclick="openChat('${o.user_id}','${esc(o.user_email)}','${o.id}')">💬</button>
      </div>
    </div>`).join('') : '<p style="color:var(--ink2);padding:16px">Aucune commande.</p>'}
  </div>`;
  if($('oFilter')) $('oFilter').value = filt;
}

/* ── Messages ── */
function renderMsgs(){
  const convs = {};
  MSG.forEach(m => {
    const c = convs[m.user_id] = convs[m.user_id]||{uid:m.user_id,email:m.user_email||'',last:m,un:0};
    if(m.user_email) c.email=m.user_email; c.last=m;
    if(!m.from_admin&&!m.read) c.un++;
  });
  const list = Object.values(convs).sort((a,b)=>b.last.created_at.localeCompare(a.last.created_at));
  $('msgs').innerHTML = `<div class="sec"><h3>💬 Messages</h3>
    <div class="convlist">${list.length ? list.map(c=>`<button class="convbtn ${c.uid===_ac?'on':''}" onclick="selConv('${c.uid}','${esc(c.email)}')">
      <span class="em">👤</span>
      <div class="info"><b>${esc(c.email||'Client')}</b><span>${esc(String(c.last.body).slice(0,45))}</span></div>
      ${c.un?`<span class="n">${c.un}</span>`:''}
    </button>`).join('') : '<p style="color:var(--ink2)">Aucun message pour le moment.</p>'}
    </div>
    ${_ac ? renderThread() : ''}
  </div>`;
}

function renderThread(){
  const uid = _ac, thread = MSG.filter(m=>m.user_id===uid);
  return `<div class="chat" id="chatThread">${thread.map(m=>`<div class="bub ${m.from_admin?'me':''} ${m.kind==='delivery'?'dlv':''}">${m.kind==='delivery'?'<b>📦 Livraison</b><br>':''}${esc(m.body)}<span>${new Date(m.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')}</div>
    <div class="chatin"><textarea id="thTx" rows="2" maxlength="2000" placeholder="Votre réponse…"></textarea><button class="btn sm" onclick="sendMsg()">Envoyer</button></div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;color:var(--ink2)"><input type="checkbox" id="isDlv" style="width:auto"> 📦 Livraison d'article (vert)</label>`;
}

function selConv(uid, email){
  _ac = uid;
  renderMsgs();
  // Marquer comme lus
  MSG.filter(m=>m.user_id===uid&&!m.from_admin&&!m.read).forEach(m=>m.read=true);
  sb.rpc('mark_read',{target:uid}).then(()=>{},()=>{});
  updateBadges();
  setTimeout(()=>{ const c=$('chatThread'); if(c) c.scrollTop=c.scrollHeight; },50);
}

async function sendMsg(){
  const tx=$('thTx'), body=tx.value.trim(); if(!_ac||!body) return;
  const dlv=$('isDlv')?.checked||false;
  const uid=_ac, email=MSG.find(m=>m.user_id===uid)?.user_email||'';
  const {data,error}=await sb.from('messages').insert({user_id:uid,user_email:email,from_admin:true,kind:dlv?'delivery':'msg',body}).select().single();
  if(error){alert('Erreur : '+error.message);return;}
  MSG.push(data); tx.value=''; renderMsgs(); selConv(uid,email);
}

function openChat(uid,email,oid){
  _ac=uid; showTab('msgs');
  setTimeout(()=>selConv(uid,email),100);
}

/* ── Avis ── */
function renderReviews(){
  const pending = R.filter(r=>!r.approved);
  const approved = R.filter(r=>r.approved).slice(0,10);
  $('reviews').innerHTML = `<div class="sec"><h3>⭐ Avis à valider <span style="color:var(--red)">(${pending.length})</span></h3>
    ${pending.length ? pending.map(r=>`<div class="item">
      <b>${'⭐'.repeat(r.rating)} ${esc(r.author)}</b>
      <div class="note">${esc(r.comment)}</div>
      <div class="row">
        <button class="btn sm green" onclick="approveRev('${r.id}')">Publier</button>
        <button class="btn sm red" onclick="delRev('${r.id}')">Supprimer</button>
      </div>
    </div>`).join('') : '<p style="color:var(--green);padding:8px 0">✅ Aucun avis en attente.</p>'}
    <h3 style="margin-top:20px">Derniers avis publiés</h3>
    ${approved.map(r=>`<div class="item"><b>${'⭐'.repeat(r.rating)} ${esc(r.author)}</b><div class="note">${esc(r.comment)}</div></div>`).join('')}
  </div>`;
}

async function approveRev(id){ await sb.from('reviews').update({approved:true}).eq('id',id); await refreshData(); }
async function delRev(id){ if(confirm('Supprimer ?')){ await sb.from('reviews').delete().eq('id',id); await refreshData(); } }
async function setStatus(id,s){ await sb.from('orders').update({status:s}).eq('id',id); await refreshData(); }

/* ── Routing ── */
function renderTab(t){
  if(t==='dash') renderDash();
  else if(t==='orders') renderOrders();
  else if(t==='msgs') renderMsgs();
  else if(t==='reviews') renderReviews();
}

/* ── Init ── */
(async()=>{
  await initSW();
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    const r = await sb.rpc('is_admin');
    if(r.data === true){
      U = session.user; ADM = true;
      await sendTokenToSW(session.access_token);
      $('loadingBox').style.display = 'none';
      showAdmin(); return;
    }
  }
  /* Affiche le formulaire de connexion */
  $('loadingBox').style.display = 'none';
  $('loginBox').style.display = 'flex';
  $('loginBox').style.flexDirection = 'column';
})();
</script>
