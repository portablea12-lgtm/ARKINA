<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--acc:#2B3BFF;--bg:#F3F5FB;--paper:#fff;--ink:#0B0D1A;--ink2:#555C7A;--line:#E1E5F0;--red:#E5384F;--gold:#FFB020;--green:#12B76A;--display:'Unbounded',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;position:relative}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),#9B6BFF,#2EE6B8);z-index:100}
header{position:sticky;top:0;z-index:20;background:rgba(243,245,251,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.logo{font:700 20px var(--display);letter-spacing:.04em;text-decoration:none}
nav{display:flex;gap:26px;font-weight:600;font-size:15px;align-items:center}
nav a.l{text-decoration:none;color:var(--ink2);position:relative}
nav a.l::after{content:"";position:absolute;left:0;bottom:-5px;height:2px;width:0;background:var(--acc);transition:width .25s}
nav a.l:hover{color:var(--acc)}nav a.l:hover::after{width:100%}
@media(max-width:700px){nav a.l{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;background:var(--acc);color:#fff;font:700 15px var(--body);padding:14px 28px;border-radius:14px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s,filter .2s}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px -8px var(--acc);filter:brightness(1.08)}
.btn:hover::after{left:130%;transition:left .65s}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink);filter:none}
.hero .btn.ghost{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.btn.sm{padding:9px 16px;font-size:14px;border-radius:11px}.btn.del{background:var(--red)}.btn.ok{background:var(--green)}
.btn[aria-disabled=true]{background:#A9AFC6;pointer-events:none}
/* hero */
.hero{background:#0B0D1A;color:#fff;position:relative;overflow:hidden;border-radius:0 0 56px 56px;padding:84px 0 100px}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.o1{width:480px;height:480px;background:var(--acc);top:-140px;left:-100px}
.o2{width:380px;height:380px;background:#9B6BFF;bottom:-160px;right:12%;animation-delay:-5s}
.o3{width:300px;height:300px;background:#2EE6B8;top:20%;right:-80px;opacity:.3;animation-delay:-9s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.18)}}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:7px 16px;border-radius:99px;font-size:14px;font-weight:600;margin-bottom:24px;backdrop-filter:blur(6px)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#2EE6B8;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.2}}
h1{font:700 clamp(40px,7.4vw,92px)/1 var(--display);letter-spacing:-.03em}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
h1 .w span{display:inline-block;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{transform:none}}
.hero p.sub{max-width:30em;margin:26px 0 34px;color:#B9BEDC;font-size:19px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:34px;margin-top:44px;flex-wrap:wrap}
.stats b{display:block;font:700 28px var(--display)}.stats span{color:#9AA0C4;font-size:14px}
.hv{position:relative;height:440px}
.fc{position:absolute;width:230px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);border-radius:24px;padding:12px;animation:bob 6s ease-in-out infinite;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.fc img,.fc .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),#9B6BFF);font-size:44px}
.fc b{display:block;margin-top:10px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc span{color:#2EE6B8;font-weight:700}
.fc:nth-child(1){top:0;left:6%;transform:rotate(-6deg)}.fc:nth-child(2){top:90px;right:0;animation-delay:-2s;transform:rotate(5deg)}.fc:nth-child(3){bottom:0;left:22%;animation-delay:-4s;transform:rotate(-2deg)}
@keyframes bob{50%{translate:0 -16px}}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}.hv{height:340px}.fc{width:180px}}
.ticker{overflow:hidden;white-space:nowrap;padding:22px 0;font:600 15px var(--display);color:var(--ink2);margin-top:8px}
.ticker div{display:inline-block;animation:tick 40s linear infinite}.ticker span{margin:0 26px}.ticker span::before{content:"✦";color:var(--acc);margin-right:26px}
@keyframes tick{to{transform:translateX(-50%)}}
section{padding:72px 0}
h2{font:700 clamp(28px,4.4vw,46px)/1.1 var(--display);letter-spacing:-.02em;margin-bottom:12px}
.lead{color:var(--ink2);max-width:36em;margin-bottom:30px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.chip{border:0;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:9px 20px;font:600 14px var(--body);cursor:pointer;transition:.2s;color:var(--ink)}
.chip:hover{box-shadow:inset 0 0 0 2px var(--acc)}.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px}
.card{background:var(--paper);border-radius:26px;overflow:hidden;border:1px solid var(--line);position:relative;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s,box-shadow .3s,opacity .7s}
.card:hover{--ty:-8px;box-shadow:0 30px 50px -22px rgba(11,13,26,.3)}
.card.rv.in{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px))}
.pic{margin:10px;border-radius:18px;aspect-ratio:1/1;overflow:hidden;position:relative;background:linear-gradient(135deg,#DDE1FF,#E9FBF3);display:grid;place-items:center;font:700 54px var(--display);color:var(--acc)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .pic img{transform:scale(1.1)}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s}
.card:hover .pic::after{transform:translateX(120%)}
.badge{position:absolute;top:20px;left:20px;z-index:2;background:var(--ink);color:#fff;font:700 11px var(--display);padding:7px 13px;border-radius:99px;letter-spacing:.04em}
.badge.red{background:var(--red)}.badge.gold{background:var(--gold);color:var(--ink)}
.txt{padding:6px 20px 22px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h3{font:600 17px/1.3 var(--display)}
.card p{color:var(--ink2);font-size:15px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.price{font:700 21px var(--display)}.old{display:block;font:500 13px var(--body);color:var(--ink2);text-decoration:line-through}
.low{color:var(--red);font-weight:700;font-size:13px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.empty{border:2px dashed var(--line);border-radius:28px;padding:64px 32px;text-align:center;max-width:540px;margin:0 auto;background:var(--paper)}
.empty h3{font:600 22px var(--display);margin-bottom:10px}.empty p{color:var(--ink2);margin-bottom:22px}
.band{background:var(--ink);color:#fff;border-radius:44px;margin:0 16px;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:var(--acc);filter:blur(100px);opacity:.35;right:-100px;top:-120px}
.band .lead{color:#AEB4D4}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.cols>div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px;transition:.3s}
.cols>div:hover{background:rgba(255,255,255,.12);transform:translateY(-6px)}
.cols h3{font:600 17px var(--display);margin-bottom:8px;color:#2EE6B8}.cols p{color:#C4C9E6;font-size:16px}
.contact{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;background:linear-gradient(120deg,var(--acc),#9B6BFF);color:#fff;border-radius:44px;padding:52px}
.contact h2{margin:0}.contact .btn{background:#fff;color:var(--ink)}
footer{padding:36px 0 48px;color:var(--ink2);font-size:14px;text-align:center}
dialog{border:0;border-radius:30px;padding:28px;width:min(620px,94vw);max-height:92vh;margin:auto;box-shadow:0 40px 90px rgba(11,13,26,.4);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(11,13,26,.6);backdrop-filter:blur(5px)}
dialog[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
.dimg{width:100%;max-height:340px;object-fit:cover;border-radius:20px;margin-bottom:14px}
.rev{padding:14px 0;border-bottom:1px solid var(--line)}.rev img{max-width:150px;border-radius:12px;margin-top:8px;display:block}
.starin button{background:none;border:0;font-size:32px;color:#CBD0E4;cursor:pointer;transition:transform .15s}.starin button.on{color:var(--gold)}.starin button:hover{transform:scale(1.3) rotate(-8deg)}
.f{display:flex;flex-direction:column;gap:10px}.f label{font-weight:700;font-size:14px}
.f input,.f textarea,.f select{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.f input[type=color]{padding:2px;height:44px}.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--acc);border-color:transparent}
.f textarea{min-height:84px;resize:vertical}.f .chk{flex-direction:row;align-items:center}.chk input{width:auto}
.note{font-size:14px;color:var(--ink2)}.note.ok{color:#0a7a4b;font-weight:700}.warn{background:#FFF4DB;border-radius:14px;padding:12px 16px;font-size:14px;color:#6B4A00}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:14px 26px;border-radius:99px;transition:transform .4s cubic-bezier(.2,.8,.2,1);z-index:200;font-weight:600;max-width:92vw}.toast.on{transform:translate(-50%,0)}
.tabs{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
#admin{display:none;padding:40px 0;background:var(--paper);border-bottom:4px solid var(--acc)}#admin.on{display:block}
.adm-grid{display:grid;grid-template-columns:minmax(290px,1fr) 1.4fr;gap:30px;align-items:start}
@media(max-width:860px){.adm-grid{grid-template-columns:1fr}}
.box{background:var(--bg);border-radius:24px;padding:24px}
.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:12px;display:none}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item img,.item .ph{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#DDE1FF;display:grid;place-items:center}.item b{flex:1;min-width:140px}
.item select{padding:8px;border-radius:10px;border:1px solid var(--line);font:inherit}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}h1 .w span{transform:none}}
</style>
</head>

      <label for="fImg">Photo</label><input id="fImg" type="file" accept="image/*">
      <img class="thumb" id="fThumb" alt="Aperçu">
      <div><button class="btn sm" onclick="saveItem()">Enregistrer</button> <button class="btn sm ghost" onclick="resetForm()">Annuler</button></div>
      <p class="note" id="fMsg"></p>
    </div>
    <div id="aProd"></div>
  </div>
  <div id="tO" style="display:none"><div id="aOrd"></div></div>
  <div id="tR" style="display:none"><div id="aRev"></div></div>
  <div id="tS" style="display:none"><div class="box f" style="max-width:640px" id="aSet"></div></div>
</div></div>

<main id="top">
  <div class="hero"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="wrap">
      <div>
        <span class="eyebrow"><i></i><span id="heroTag">Nouveautés disponibles</span></span>
        <h1 id="heroTitle">BOUTIQUE</h1>
        <p class="sub" id="heroSub"></p>

      <div class="rv"><h3 id="g3t"></h3><p id="g3x"></p></div>
    </div>
  </div></div></section>

  <section id="contact" style="padding-top:0"><div class="wrap"><div class="contact rv">

  </div></div></section>
</main>
<footer><div class="wrap" id="footTxt"></div></footer>

let S = {...DEF}, P = [], R = [], O = [], cat = 'Tout', U = null, ADM = false, cats = [];

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),3600); }
const payMode = p => p.pay_mode || S.defaultPay;
const payUrl = p => "https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=" + encodeURIComponent(S.paypal) + "&item_name=" + encodeURIComponent(p.name) + "&amount=" + Number(p.price).toFixed(2) + "&currency_code=EUR&no_shipping=1";
function img2data(file, max=800){
  return new Promise(res => { const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
    const s=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement('canvas');
    c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.8)); }; im.src=r.result; }; r.readAsDataURL(file); });
}
const rating = id => { const l=R.filter(r=>r.product_id===id&&r.approved); return l.length ? {n:l.length,avg:l.reduce((a,r)=>a+r.rating,0)/l.length} : null; };

/* ═══ Réglages → page ═══ */
function applySettings(){
  const t = (id,v) => { $(id).textContent = v; };
  document.documentElement.style.setProperty('--acc', S.accent);
  document.title = S.brand; t('brandLogo',S.brand); t('heroTag',S.heroTag); t('heroSub',S.heroSub); t('heroCta',S.heroCta);
  $('heroTitle').innerHTML = esc(S.brand).split(' ').map((w,i)=>`<span class="w"><span style="animation-delay:${i*.12}s">${w}</span></span>`).join(' ');
  ['catTitle','catLead','engTitle','engLead','g1t','g1x','g2t','g2x','g3t','g3x','ctTitle','ctText'].forEach(k => t(k,S[k]));
  $('mailBtn').href='mailto:'+S.contact; t('mailBtn',S.contact);
  t('footTxt','© '+new Date().getFullYear()+' '+S.brand+'. '+S.footer);
  const items = S.ticker.split('\n').map(x=>x.trim()).filter(Boolean);
  $('tk').innerHTML = (items.map(x=>`<span>${esc(x)}</span>`).join('')).repeat(Math.max(4,Math.ceil(16/Math.max(items.length,1))));
}

/* ═══ Boutique ═══ */
function reveal(){
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.1});
  document.querySelectorAll('.rv:not(.in)').forEach((el,i) => { el.style.transitionDelay = (i%4)*90+'ms'; io.observe(el); });
}
function countUp(el, to, dec=0){
  const t0 = performance.now(), from = parseFloat(el.dataset.v||0); el.dataset.v = to;
  (function f(t){ const k=Math.min(1,(t-t0)/900), e=1-Math.pow(1-k,3); el.textContent=(from+(to-from)*e).toFixed(dec).replace('.',','); if(k<1) requestAnimationFrame(f); })(t0);
}
function renderHero(){
  const vis = P.filter(p=>p.visible), appr = R.filter(r=>r.approved);
  countUp($('stA'), vis.length); countUp($('stR'), appr.length);
  if(appr.length) countUp($('stN'), appr.reduce((a,r)=>a+r.rating,0)/appr.length, 1); else $('stN').textContent='–';
  $('hv').innerHTML = vis.slice(0,3).map(p=>`<div class="fc">${p.image?`<img src="${esc(p.image)}" alt="">`:`<div class="ph">✦</div>`}<b>${esc(p.name)}</b><span>${eur(p.price)}</span></div>`).join('');
}
function setCat(i){ cat = cats[i]; renderShop(); }
function renderShop(){
  const vis = P.filter(p => p.visible);
  cats = ['Tout', ...new Set(vis.map(p => p.category).filter(Boolean))];
  if(!cats.includes(cat)) cat = 'Tout';
  $('chips').innerHTML = cats.length > 2 ? cats.map((c,i) => `<button class="chip ${c===cat?'on':''}" onclick="setCat(${i})">${esc(c)}</button>`).join('') : '';
  const list = vis.filter(p => cat==='Tout' || p.category===cat), g = $('grid');
  renderHero();
  if(!sb){ g.style.display='block'; g.innerHTML='<div class="empty"><h3>Boutique en cours de configuration</h3><p>Renseignez SB_URL et SB_KEY en haut du script de index.html.</p></div>'; return; }
  if(!list.length){ g.style.display='block'; g.innerHTML=`<div class="empty"><h3>Le catalogue ouvre bientôt</h3><p>Les premiers articles arrivent. Écrivez-nous pour être prévenu.</p><a class="btn" href="mailto:${esc(S.contact)}">Être prévenu</a></div>`; return; }
  g.style.display='';
  g.innerHTML = list.map(p => {
    const rt = rating(p.id), out = p.stock === 0, promo = p.old_price > p.price;
    const badge = out ? '<span class="badge">ÉPUISÉ</span>' : promo ? `<span class="badge red">-${Math.round((1-p.price/p.old_price)*100)}%</span>` : p.badge ? `<span class="badge gold">${esc(p.badge)}</span>` : '';
    return `<article class="card rv" onclick="openProduct('${p.id}')">${badge}
      <div class="pic">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : esc((p.name||'?')[0].toUpperCase())}</div>
      <div class="txt"><h3>${esc(p.name)}</h3>
        ${rt ? `<span class="stars" aria-label="${rt.avg.toFixed(1)} sur 5">${stars(rt.avg)} <span class="note">(${rt.n})</span></span>` : ''}
        <p>${esc(p.descr)}</p>
        ${p.stock > 0 && p.stock <= 5 ? `<span class="low">Plus que ${p.stock} en stock</span>` : ''}
        <div class="row"><span class="price">${promo?`<span class="old">${eur(p.old_price)}</span>`:''}${eur(p.price)}</span>
        <button class="btn sm" ${out?'aria-disabled="true"':''} onclick="event.stopPropagation();checkout('${p.id}')">${out?'Épuisé':'Acheter'}</button></div>
      </div></article>`; }).join('');
  reveal();
}
$('grid').addEventListener('mousemove', e => { const c = e.target.closest('.card'); if(!c || matchMedia('(hover:none)').matches) return;
  const b = c.getBoundingClientRect(); c.style.setProperty('--ry', ((e.clientX-b.left)/b.width-.5)*8+'deg'); c.style.setProperty('--rx', -((e.clientY-b.top)/b.height-.5)*8+'deg'); });
$('grid').addEventListener('mouseout', e => { const c = e.target.closest('.card'); if(c){ c.style.setProperty('--rx','0deg'); c.style.setProperty('--ry','0deg'); } });
addEventListener('scroll', () => { $('prog').style.width = (scrollY/(document.documentElement.scrollHeight-innerHeight)*100)+'%'; }, {passive:true});

/* ═══ Fiche produit + avis ═══ */
let curStar = 0, revPhoto = '';
function openProduct(id){
  const p = P.find(x => x.id === id), l = R.filter(r => r.product_id === id && r.approved), rt = rating(id); curStar = 0; revPhoto = '';
  $('dlgBody').innerHTML = `${p.image?`<img class="dimg" src="${esc(p.image)}" alt="${esc(p.name)}">`:''}
    <h3 style="font:600 22px var(--display)">${esc(p.name)}</h3>
    ${rt?`<span class="stars">${stars(rt.avg)}</span> <span class="note">${rt.avg.toFixed(1)} · ${rt.n} avis</span>`:''}
    <p style="margin:10px 0">${esc(p.descr)}</p>
    <div class="row" style="margin-bottom:8px"><span class="price">${eur(p.price)}</span>${p.stock===0?'<span class="low">Épuisé</span>':`<button class="btn" onclick="checkout('${p.id}')">Acheter</button>`}</div>
    <h4 style="margin:22px 0 4px">Avis clients</h4>
    ${l.length ? l.map(r => `<div class="rev"><span class="stars">${stars(r.rating)}</span> <b>${esc(r.author)}</b><p>${esc(r.comment)}</p>${r.photo ? `<img src="${esc(r.photo)}" alt="Photo de ${esc(r.author)}">` : ''}</div>`).join('') : '<p class="note">Aucun avis pour le moment.</p>'}
    <h4 style="margin:20px 0 8px">Donner mon avis</h4>
    ${U ? `<div class="f"><div class="starin" id="sIn">${[1,2,3,4,5].map(i=>`<button type="button" aria-label="${i} étoile(s)" onclick="setStar(${i})">★</button>`).join('')}</div>
    <label for="rN">Votre prénom</label><input id="rN" maxlength="60" value="${esc(U.user_metadata?.name||'')}">
    <label for="rC">Commentaire</label><textarea id="rC" maxlength="800"></textarea>
    <label for="rP">Photo (optionnel)</label><input id="rP" type="file" accept="image/*" onchange="rPhoto(this)">
    <button class="btn sm" onclick="sendReview('${p.id}')">Envoyer mon avis</button><p class="note" id="rM"></p></div>`
    : `<p class="note">Connectez-vous pour laisser un avis.</p><button class="btn sm" onclick="openAcc()">Connexion / Inscription</button>`}`;
  if(!dlg.open) dlg.showModal();
}
function setStar(n){ curStar = n; [...$('sIn').children].forEach((b,i)=>b.classList.toggle('on', i<n)); }
async function rPhoto(el){ revPhoto = el.files[0] ? await img2data(el.files[0], 700) : ''; }
async function sendReview(pid){
  const a = $('rN').value.trim(); if(!curStar || !a){ $('rM').textContent = 'Choisissez une note et indiquez votre prénom.'; return; }
  const {error} = await sb.from('reviews').insert({product_id:pid, author:a, rating:curStar, comment:$('rC').value.trim(), photo:revPhoto});
  if(error){ $('rM').textContent = "Envoi impossible, réessayez."; return; }
  dlg.close(); toast('Merci ! Votre avis sera publié après validation.');
}

/* ═══ Achat ═══ */
function checkout(id){
  if(!U){ openAcc('login', "Connectez-vous ou créez un compte pour commander."); return; }
  const p = P.find(x => x.id === id), fp = payMode(p) === 'fp';
  $('dlgBody').innerHTML = `<h3 style="font:600 22px var(--display);margin-bottom:6px">Votre commande</h3>
    <p><b>${esc(p.name)}</b> · <span class="price" style="font-size:18px">${eur(p.price)}</span></p>
    ${fp ? `<div class="warn" style="margin:14px 0">${esc(S.fpNote)}</div>
      <ol style="margin:0 0 16px 20px"><li>Ouvrez PayPal, choisissez <b>« Envoyer à un proche »</b>.</li>
      <li>Envoyez <b>${eur(p.price)}</b> à <b>${esc(S.paypal)}</b>.</li><li>Cliquez ensuite sur « J'ai envoyé le paiement ».</li></ol>
      <div class="cta"><button class="btn sm ghost" onclick="navigator.clipboard.writeText('${esc(S.paypal)}');toast('Email copié')">Copier l'email PayPal</button>
      <button class="btn ok" onclick="logOrder('${p.id}','entre proches',true)">J'ai envoyé le paiement</button></div>`
    : `<p class="note" style="margin:10px 0 16px">Paiement sécurisé PayPal (biens et services). Une fois payé, votre commande est suivie par le vendeur.</p>
      <a class="btn" href="${payUrl(p)}" target="_blank" rel="noopener" onclick="logOrder('${p.id}','biens et services',false)">Payer ${eur(p.price)} avec PayPal</a>`}`;
  if(!dlg.open) dlg.showModal();
}
async function logOrder(pid, method, close){
  const p = P.find(x => x.id === pid);
  const {error} = await sb.from('orders').insert({user_email:U.email, product_id:pid, product_name:p.name, price:p.price, method});
  if(error) toast("Commande non enregistrée, contactez le vendeur."); else if(close){ dlg.close(); toast('Merci ! Le vendeur va confirmer votre paiement.'); }
}

/* ═══ Comptes ═══ */
async function refreshUser(){
  const {data} = await sb.auth.getSession(); U = data.session?.user || null; ADM = false;
  if(U){ const r = await sb.rpc('is_admin'); ADM = r.data === true; }
  $('accBtn').textContent = U ? 'Mon compte' : 'Connexion';
}
function openAcc(mode='login', msg=''){
  if(!sb) return;
  if(U){
    const mine = O.filter(o => o.user_id === U.id);
    $('dlgBody').innerHTML = `<h3 style="font:600 22px var(--display)">Mon compte</h3><p class="note">${esc(U.email)}</p>
      <h4 style="margin:18px 0 6px">Mes commandes</h4>
      ${mine.length ? mine.map(o=>`<div class="item"><b>${esc(o.product_name)}</b><span>${eur(o.price)}</span><span class="note">${esc(o.status)}</span></div>`).join('') : '<p class="note">Aucune commande.</p>'}
      <div style="margin-top:16px" class="cta">${ADM?'<a class="btn sm" href="#admin" onclick="dlg.close()">Espace admin</a>':''}<button class="btn sm del" onclick="doLogout()">Déconnexion</button></div>`;
  } else {
    const su = mode === 'signup';
    $('dlgBody').innerHTML = `<h3 style="font:600 22px var(--display);margin-bottom:6px">${su?'Créer un compte':'Connexion'}</h3>${msg?`<div class="warn" style="margin-bottom:12px">${esc(msg)}</div>`:''}
      <div class="f">${su?'<label for="aN">Prénom</label><input id="aN" maxlength="40" autocomplete="given-name">':''}
      <label for="aE">Email</label><input id="aE" type="email" autocomplete="username">
      <label for="aP">Mot de passe ${su?'(6 caractères minimum)':''}</label><input id="aP" type="password" autocomplete="${su?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')doAuth(${su})">
      <button class="btn" onclick="doAuth(${su})">${su?'Créer mon compte':'Se connecter'}</button><p class="note" id="aM"></p>
      <button class="linkb" style="background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;text-align:left" onclick="openAcc('${su?'login':'signup'}')">${su?'J\'ai déjà un compte':'Pas encore de compte ? Inscription'}</button></div>`;
  }
  if(!dlg.open) dlg.showModal();
}
async function doAuth(su){
  const email = $('aE').value.trim(), password = $('aP').value, m = $('aM');
  const r = su ? await sb.auth.signUp({email, password, options:{data:{name:$('aN').value.trim()}}}) : await sb.auth.signInWithPassword({email, password});
  if(r.error){ m.textContent = su ? "Inscription impossible : " + r.error.message : "Email ou mot de passe incorrect."; return; }
  if(su && !r.data.session){ m.className='note ok'; m.textContent = "Compte créé ! Vérifiez votre boîte mail pour confirmer, puis connectez-vous."; return; }
  await refreshUser(); await load(); dlg.close(); toast('Bienvenue !'); openAdminIfHash();
}
async function doLogout(){ await sb.auth.signOut(); await refreshUser(); O = []; closeAdmin(); dlg.close(); toast('Déconnecté'); }

/* ═══ Admin ═══ */
let curImg = '';
function openAdminIfHash(){
  if(location.hash !== '#admin' || !sb) return;
  if(!U){ openAcc('login', 'Connexion administrateur'); return; }
  if(!ADM){ toast('Accès réservé à l\'administrateur'); return; }
  $('admin').classList.add('on'); buildSet(); renderAdmin(); $('admin').scrollIntoView();
}
function closeAdmin(){ $('admin').classList.remove('on'); if(location.hash==='#admin') history.replaceState(null,'',location.pathname); }
function tab(t){ ['P','O','R','S'].forEach(k => $('t'+k).style.display = k===t ? '' : 'none'); $('tP').style.display = t==='P' ? '' : 'none';
  document.querySelectorAll('#tabs .chip[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t===t)); }
function renderAdmin(){
  $('aProd').innerHTML = P.length ? P.map(p => `<div class="item">
    ${p.image ? `<img src="${esc(p.image)}" alt="">` : '<div class="ph">✦</div>'}
    <b>${esc(p.name)}${p.visible?'':' <span class="note">(masqué)</span>'}</b><span class="price" style="font-size:16px">${eur(p.price)}</span>
    <button class="btn sm ghost" onclick="editItem('${p.id}')">Modifier</button>
    <button class="btn sm ghost" onclick="toggleVis('${p.id}')">${p.visible?'Masquer':'Afficher'}</button>
    <button class="btn sm del" onclick="delItem('${p.id}')">Supprimer</button></div>`).join('') : '<p class="note">Aucun article.</p>';
  const po = O.filter(o => o.status === 'en attente').length, pr = R.filter(r => !r.approved).length;
  $('pO').textContent = po ? `(${po})` : ''; $('pR').textContent = pr ? `(${pr})` : '';
  $('aOrd').innerHTML = O.length ? O.map(o => `<div class="item"><b>${esc(o.product_name)}<br><span class="note">${esc(o.user_email)} · ${esc(o.method)} · ${new Date(o.created_at).toLocaleDateString('fr-FR')}</span></b>
    <span class="price" style="font-size:16px">${eur(o.price)}</span>
    <select aria-label="Statut" onchange="setStatus('${o.id}',this.value)">${['en attente','payée','livrée','annulée'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <button class="btn sm del" onclick="delOrder('${o.id}')">Supprimer</button></div>`).join('') : '<p class="note">Aucune commande.</p>';
  $('aRev').innerHTML = R.length ? R.map(r => { const p = P.find(x => x.id===r.product_id);
    return `<div class="rev"><span class="stars">${stars(r.rating)}</span> <b>${esc(r.author)}</b> sur ${esc(p?.name||'?')} ${r.approved?'':'<b style="color:var(--red)">· à valider</b>'}
    <p>${esc(r.comment)}</p>${r.photo?`<img src="${esc(r.photo)}" alt="">`:''}
    <div style="margin-top:8px">${r.approved?'':`<button class="btn sm ok" onclick="appr('${r.id}')">Publier</button> `}<button class="btn sm del" onclick="delRev('${r.id}')">Supprimer</button></div></div>`; }).join('') : '<p class="note">Aucun avis.</p>';
}
const setStatus = async (id,s) => { await sb.from('orders').update({status:s}).eq('id',id); await load(); toast('Statut mis à jour'); };
const delOrder = async id => { if(confirm('Supprimer cette commande ?')){ await sb.from('orders').delete().eq('id',id); await load(); } };
const appr = async id => { await sb.from('reviews').update({approved:true}).eq('id',id); await load(); toast('Avis publié'); };
const delRev = async id => { if(confirm('Supprimer cet avis ?')){ await sb.from('reviews').delete().eq('id',id); await load(); } };
function resetForm(){ ['fId','fName','fDesc','fPrice','fOld','fCat','fStock','fImg'].forEach(k => $(k).value=''); $('fBadge').value=''; $('fPay').value=''; $('fVis').checked=true;
  curImg=''; $('fThumb').style.display='none'; $('fTitle').textContent='Nouvel article'; }
function editItem(id){ const p = P.find(x => x.id===id);
  $('fId').value=id; $('fName').value=p.name; $('fDesc').value=p.descr||''; $('fPrice').value=p.price; $('fOld').value=p.old_price??''; $('fCat').value=p.category||'';
  $('fBadge').value=p.badge||''; $('fPay').value=p.pay_mode||''; $('fStock').value=p.stock??''; $('fVis').checked=p.visible; curImg=p.image||'';
  $('fThumb').src=curImg; $('fThumb').style.display=curImg?'block':'none'; $('fTitle').textContent="Modifier l'article"; $('admin').scrollIntoView({behavior:'smooth'}); }
async function toggleVis(id){ const p=P.find(x=>x.id===id); await sb.from('products').update({visible:!p.visible}).eq('id',id); await load(); }
async function delItem(id){ if(confirm('Supprimer cet article ?')){ await sb.from('products').delete().eq('id',id); await load(); resetForm(); } }
async function saveItem(){
  const name = $('fName').value.trim(), price = parseFloat($('fPrice').value), m = $('fMsg'); m.className='note';
  if(!name || !(price >= 0)){ m.textContent='Nom et prix valides requis.'; return; }
  const num = v => v === '' ? null : Number(v);
  const row = {name, descr:$('fDesc').value.trim(), price, old_price:num($('fOld').value), category:$('fCat').value.trim(), badge:$('fBadge').value, pay_mode:$('fPay').value, stock:num($('fStock').value), visible:$('fVis').checked, image:curImg};
  const id = $('fId').value;
  const {error} = id ? await sb.from('products').update(row).eq('id',id) : await sb.from('products').insert(row);
  if(error){ m.textContent = 'Erreur : ' + error.message; return; }
  resetForm(); await load(); m.textContent='Enregistré ✓ (visible partout)'; m.className='note ok';
}
$('fImg').addEventListener('change', async e => { if(e.target.files[0]){ curImg = await img2data(e.target.files[0]); $('fThumb').src=curImg; $('fThumb').style.display='block'; } });
function buildSet(){
  $('aSet').innerHTML = FIELDS.map(([k,l,t,o]) => k==='h' ? `<h4 style="margin-top:16px;font:600 16px var(--display)">${l}</h4>` :
    `<label for="s_${k}">${l}</label>` + (t==='a' ? `<textarea id="s_${k}">${esc(S[k])}</textarea>` : t==='c' ? `<input type="color" id="s_${k}" value="${esc(S[k])}">`
    : t==='s' ? `<select id="s_${k}">${o.map(([v,n])=>`<option value="${v}" ${S[k]===v?'selected':''}>${n}</option>`).join('')}</select>` : `<input id="s_${k}" value="${esc(S[k])}">`)).join('')
    + '<div class="warn">Si vous choisissez « entre proches » : PayPal réserve ce mode aux paiements personnels, et votre compte peut être limité s\'il sert à vendre. Le site affiche l\'absence de protection aux acheteurs.</div><div><button class="btn" onclick="saveSet()">Enregistrer les réglages</button> <button class="btn ghost" onclick="if(confirm(\'Remettre les textes par défaut ?\')){S={...DEF};buildSet()}">Valeurs par défaut</button></div><p class="note" id="sM"></p>';
}
async function saveSet(){
  FIELDS.forEach(([k,,t]) => { if(k!=='h') S[k] = $('s_'+k).value; });
  const {error} = await sb.from('settings').upsert({id:1, data:S});
  $('sM').textContent = error ? 'Erreur : ' + error.message : 'Réglages enregistrés ✓ (visibles partout)'; $('sM').className = error ? 'note' : 'note ok';
  applySettings(); renderShop();
}

/* ═══ Démarrage ═══ */
async function load(){
  if(!sb){ applySettings(); renderShop(); return; }
  const q = [sb.from('products').select('*').order('created_at',{ascending:false}), sb.from('reviews').select('*').order('created_at',{ascending:false}), sb.from('settings').select('data').eq('id',1).maybeSingle()];
  if(U) q.push(sb.from('orders').select('*').order('created_at',{ascending:false}));
  const [a,b,c,d] = await Promise.all(q);
  P = a.data || []; R = b.data || []; S = {...DEF, ...(c.data?.data || {})}; O = d?.data || [];
  applySettings(); renderShop(); if(ADM) renderAdmin();
}
(async function(){
  applySettings(); reveal();
  if(sb) await refreshUser();
  await load(); openAdminIfHash();
})();
addEventListener('hashchange', openAdminIfHash);
</script>
</body>
</html>
